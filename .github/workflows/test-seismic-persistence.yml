name: DR Radar - EMSC USGS persistence offline
on:
  pull_request:
    paths:
      - 'apps-script/seismic-radar/Code.gs'
      - 'tests/test_seismic_emsc_usgs_persistence.cjs'
      - '.github/workflows/test-seismic-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/test_seismic_emsc_usgs_persistence.cjs
      - run: node tests/test_seismic_emsc_usgs_persistence.cjs
