name: Generate shared DR Audio

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_shared_dr_audio.py'
  schedule:
    # República Dominicana = UTC-4 todo el año.
    # Revisión automática cada 10 minutos, desplazada 3 min del cambio de decena
    # para reducir la posibilidad de retrasos por carga alta en GitHub Actions.
    # Las revisiones normales reservan la cuota para noticias nuevas.
    - cron: '3,13,23,33,43,53 * * * *'
    # Intento oportunista de 1 artículo histórico completo justo antes del reinicio diario
    # de Gemini (medianoche de Los Ángeles). Se ejecuta a ambas horas posibles
    # por el cambio DST y el propio workflow decide cuál corresponde ese día.
    - cron: '50 6,7 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE-DR-AUDIO to generate and publish shared audio'
        required: true
        default: 'NO'
      backfill_count:
        description: 'Older missing articles to generate in this manual run (0-5)'
        required: true
        default: '0'

permissions:
  contents: read

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.confirm == 'GENERATE-DR-AUDIO'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            google-genai google-auth requests beautifulsoup4
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate missing shared audio and preserve history
        env:
          GEMINI_API_KEY_DR_AUDIO: '${{ secrets.GEMINI_API_KEY_DR_AUDIO }}'
          EVENT_NAME: '${{ github.event_name }}'
          EVENT_SCHEDULE: '${{ github.event.schedule }}'
          MANUAL_BACKFILL: '${{ inputs.backfill_count }}'
        shell: bash
        run: |
          set -euo pipefail

          BACKFILL=0
          OPPORTUNISTIC=""

          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "50 6,7 * * *" ]]; then
            # Solo uno de estos dos horarios cae a las 23:50 en Los Ángeles
            # (según horario de verano/invierno). Ese es el momento correcto
            # para completar un artículo antiguo con las voces que le falten sin competir con noticias nuevas.
            LA_HOUR="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Los_Angeles")).strftime("%H"))
          PY
          )"

            if [[ "$LA_HOUR" == "23" ]]; then
              BACKFILL=1
              OPPORTUNISTIC="--opportunistic-backfill"
            fi

          elif [[ "$EVENT_NAME" != "schedule" ]]; then
            BACKFILL="${MANUAL_BACKFILL:-0}"
          fi

          if ! [[ "$BACKFILL" =~ ^[0-5]$ ]]; then
            echo "backfill_count must be an integer from 0 to 5"
            exit 2
          fi

          echo "Historical backfill budget for this run: $BACKFILL"
          echo "Opportunistic backfill mode: ${OPPORTUNISTIC:-off}"

          python scripts/generate_shared_dr_audio.py \
            --output dr_audio_build \
            --scan-posts 500 \
            --backfill-count "$BACKFILL" \
            $OPPORTUNISTIC

      - name: Deploy DR Audio preserving all other Hosting files
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/deploy_shared_dr_audio.py dr_audio_build

      - name: Summary
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data=json.loads(Path("dr_audio_build/dr-audio/index.json").read_text(encoding="utf-8"))
          print("### DR Audio shared library updated")
          print("")
          print("Catalog: https://dr-accesorios-rd.web.app/dr-audio/index.json")
          print("")
          print(f"Shared historical articles: **{data.get('historyCount', len(data.get('entries', [])))}**")
          print("")
          print(f"Library cap: **{data.get('maxLibraryEntries', 'n/a')}** article entries")
          print("")
          print(f"Newest male voices ready: **{data.get('latestMaleReady', 0)}/{data.get('latestCount', 0)}**")
          print("")
          print(f"Oldest entries pruned this run: **{data.get('prunedCount', 0)}**")
          print("")
          print("The newest five keep female compatibility first; male audio is generated next. Historical voice backfill only uses spare quota and never displaces a new article.")
          PY
