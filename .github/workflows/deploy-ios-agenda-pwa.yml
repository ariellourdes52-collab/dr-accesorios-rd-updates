name: DR Agenda iOS - Publicar PWA protegida
run-name: DR Agenda iOS - ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Auditar primero; publicar modifica solo tres archivos de PWA
        required: true
        type: choice
        default: auditar
        options:
          - auditar
          - publicar
      confirm:
        description: Para publicar escribir PUBLICAR-DR-AGENDA-IOS
        required: false
        type: string
        default: NO

permissions:
  contents: read
concurrency:
  group: dr-agenda-ios-hosting-protected
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias seguras
        run: python -m pip install --quiet 'requests>=2.31,<3' 'google-auth>=2.29,<3' 'Pillow>=10,<13'
      - name: Verificar Python y JS del proyecto
        run: |
          python -m py_compile scripts/deploy_ios_agenda_pwa.py scripts/publish_dr_agenda_telegram.py services/dr-radar-webpush/app.py
          node --check landing/radar-alertas/sw.js
          python -m unittest discover -s tests -p 'test_dr_agenda_ios_webpush.py' -v
      - name: Publicación de Web App iOS limitada
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/deploy_ios_agenda_pwa.py --mode "$MODE" --confirm "$CONFIRM"
