name: Desactivar alerta DR Radar por ID

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: 'ID exacto de la alerta que deseas desactivar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dr-radar-manual-clear
  cancel-in-progress: false

jobs:
  clear-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Desactivar exclusivamente la alerta indicada, sin FCM
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
          RADAR_ALERT_ID: '${{ inputs.alert_id }}'
        run: python scripts/manual_clear_radar_alert.py --alert-id "$RADAR_ALERT_ID" --action deactivate --confirm BORRAR --no-fcm
