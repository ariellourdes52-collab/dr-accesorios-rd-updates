name: DR Web Push seismic dedup offline
on:
  pull_request:
    paths:
      - 'services/dr-radar-webpush/**'
      - 'tests/test_web_seismic_dedup.py'
      - '.github/workflows/test-web-seismic-dedup.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile services/dr-radar-webpush/app.py services/dr-radar-webpush/early_seismic.py services/dr-radar-webpush/web_seismic_dedup.py
      - run: python -m unittest discover -s tests -p 'test_web_seismic_dedup.py' -v
      - run: python -m unittest discover -s tests -p 'test_radar_early_seismic.py' -v
