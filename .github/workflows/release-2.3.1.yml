name: Release DR Accesorios RD 2.3.1

# Automatic publication schedule cancelled on 2026-10-06.
# The existing draft release is intentionally retained as development history.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-2.3.1 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release date safety gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-11-12" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-2.3.1" ]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Workflow self-check
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "release-2.3.1.yml parsed correctly."
          echo "Safety gate kept the release disabled for this push."

      - name: Sync v2.3.1 draft metadata
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.id==397786001 or .tag_name=="2.3.1") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Draft release 2.3.1 was not found."
            exit 1
          fi

          IS_DRAFT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release 2.3.1 is no longer a draft; metadata sync skipped."
            exit 0
          fi

          cat > /tmp/v231-body.md <<'BODY'
          DR Accesorios RD v2.3.1 — DR Audio, ahora más sólido, inteligente y completo 🎧✨

          La versión 2.3.1 perfecciona DR Audio y lleva DR Radar a una nueva etapa de rapidez, estabilidad y protección para República Dominicana.

          • 🎙️ Nueva selección de voz: elige entre voz femenina y masculina en español latino neutro, y la app recuerda tu preferencia.

          • 🌎 DR Radar — Alertas sísmicas: incorpora avisos de actividad sísmica identificada para República Dominicana, integrados directamente dentro de DR Radar.

          • ⚡ Ruta sísmica rápida 24/7: DR Radar mantiene un servicio permanente en la nube que escucha estaciones sísmicas de República Dominicana y Puerto Rico para detectar candidatos mucho antes del ciclo tradicional de consulta.

          • 🧭 Validación multiestación: un candidato necesita coincidencia de varias estaciones y participación de una estación ancla cercana a República Dominicana antes de avanzar.

          • ✅ Doble corroboración: los candidatos deben coincidir con información publicada por EMSC y USGS antes de convertirse en una alerta pública.

          • 🛟 Respaldo automático: la ruta tradicional basada en USGS continúa funcionando como sistema de respaldo y comparte deduplicación para evitar avisos dobles del mismo evento.

          • 🔔 Avisos sísmicos críticos: cuando corresponde, la app puede emitir una notificación de alta prioridad con sonido y vibración. Al tocarla, abre DR Radar para consultar el evento.

          • 🚀 Procesamiento Android más rápido: las actualizaciones urgentes de DR Radar pueden usar trabajo acelerado y una comprobación adicional breve cuando el evento acaba de publicarse.

          • 📡 Fuente sísmica dedicada: la información sísmica se mantiene separada del Radar tecnológico, conservando compatibilidad con las versiones anteriores compatibles.

          • 🛡️ Privacidad: las alertas sísmicas no requieren ni solicitan la ubicación del usuario.

          • 🔄 Recuperación inteligente de reproducción: si cierras la app o Android la detiene, DR Audio recuerda la noticia, la voz y el punto donde estabas escuchando.

          • 🎧 Mejor integración con Bluetooth y auriculares: DR Audio responde correctamente ante llamadas, otras aplicaciones de audio y desconexiones de audífonos.

          • ⏳ Noticias recién publicadas más inteligentes: si el audio todavía se está preparando, la app lo indica claramente y vuelve a comprobarlo automáticamente sin afectar la cola.

          • 📡 Mejor manejo de conexión: DR Audio distingue entre problemas de Internet y audios todavía en preparación, incorporando reintentos automáticos.

          • 💾 Caché optimizada: los audios descargados se reutilizan mejor, se evitan descargas duplicadas y se protegen los archivos que estás escuchando o tienes en cola.

          • ▶️ Reproducción más estable: mejoras en pausas, reanudaciones, cambios de noticia, controles externos y tiempos de carga.

          • 🔄 Sincronización mejorada: Home, lector de artículos, notificación y reproducción en segundo plano mantienen el mismo estado de noticia, voz, progreso y reproducción.

          • 📊 Analytics específicos para DR Audio: nuevas métricas internas permiten conocer mejor cómo se utiliza la función y continuar mejorándola.

          • ⚡ Menor consumo de recursos y mayor estabilidad general.

          ### Todo lo que ya te gustaba sigue ahí

          DR Accesorios RD v2.3.1 mantiene comentarios, respuestas y likes, notificaciones, Radar, historial de lectura, Continuar leyendo, artículos offline, redes sociales, lector nativo, actualizaciones automáticas y todas las funciones incorporadas anteriormente.

          > Las alertas sísmicas informan eventos ya detectados y corroborados por fuentes sísmicas; no constituyen un sistema de predicción ni garantizan aviso previo antes de sentir un sismo.

          ---

          ### 🔐 Verificación del APK

          **Archivo:** `dr-accesorios-rd.apk`  
          **SHA-256:** `e84302cc9dd150b1aafa8dfea1a5b608f75acf7662a855e48e0666c71a1c778e`
          BODY

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field tag_name="2.3.1" \
            --raw-field body="$(cat /tmp/v231-body.md)"

          echo "Draft 2.3.1 metadata synchronized."

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 17,
            "versionName": "2.3.1",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "🎙️ Elige voz femenina o masculina en DR Audio\n🌎 DR Radar incorpora alertas sísmicas para República Dominicana\n⚡ Nueva ruta sísmica rápida 24/7 en la nube\n✅ Validación multiestación y corroboración EMSC + USGS\n🛟 USGS continúa como respaldo automático\n🔔 Avisos sísmicos críticos con sonido y vibración\n🚀 Procesamiento urgente de Radar optimizado\n🔄 Recuperación inteligente de noticia, voz y posición\n🎧 Mejor integración con Bluetooth, auriculares y llamadas\n💾 Caché, sincronización y estabilidad mejoradas"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 17 --version-name 2.3.1 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.3.1") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 2.3.1 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          EXPECTED_DIGEST="sha256:e84302cc9dd150b1aafa8dfea1a5b608f75acf7662a855e48e0666c71a1c778e"

          if [ "$APK_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK digest mismatch."
            echo "Expected: $EXPECTED_DIGEST"
            echo "Found:    $APK_DIGEST"
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 2.3.1 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 17 --version-name 2.3.1 --legacy-max-version-code 14

      - name: Legacy 1.6/1.7 delivery reminder
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          echo "::warning::Versions 1.6 and 1.7 are not covered by the Firestore registry. Send the two Firebase Notifications composer campaigns targeted strictly by App version after this release. See docs/legacy-update-delivery.md."
          {
            echo "### Legacy update delivery still required"
            echo ""
            echo "Versions **1.6** and **1.7** must receive separate Firebase Notifications composer campaigns targeted strictly by **App version**."
            echo ""
            echo "Follow `docs/legacy-update-delivery.md`. Do not use a notification payload on the shared `blog_updates` topic."
          } >> "$GITHUB_STEP_SUMMARY"
