name: Deploy DR Radar Blogger widget

on:
  push:
    branches:
      - main
    paths:
      - 'landing/radar-widget/**'
      - 'landing/radar-alertas/**'
      - 'scripts/deploy_radar_widget.py'
      - '.github/workflows/deploy-radar-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-blogger-widget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Deploy DR Radar Blogger widget preserving Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_radar_widget.py
