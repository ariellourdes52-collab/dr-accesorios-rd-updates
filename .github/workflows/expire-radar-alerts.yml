name: Expire DR Radar alerts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/expire_radar_alerts.py'
  schedule:
    # Native GitHub cron is only an emergency bootstrap.
    # The workflow self-chains every ~5 minutes through workflow_dispatch.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: dr-radar-auto-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Expire DR Radar alerts
        id: expire
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/expire_radar_alerts.py

      - name: Hold five-minute cadence
        if: always()
        run: sleep 300

      - name: Queue next automatic expiry cycle
        if: always()
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/expire-radar-alerts.yml/dispatches"
          payload='{"ref":"main"}'

          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api}" \
              --data "${payload}"
            then
              echo "OK: próximo ciclo de expiración encolado."
              exit 0
            fi

            echo "AVISO: fallo al encolar el próximo ciclo (intento ${attempt}/3)."
            sleep 5
          done

          echo "ERROR: no se pudo encolar el próximo ciclo."
          exit 1

      - name: Propagate expiration failure
        if: always() && steps.expire.outcome == 'failure'
        run: |
          echo "La expiración falló, pero el siguiente ciclo ya fue encolado."
          exit 1
