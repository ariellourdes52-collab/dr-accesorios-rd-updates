name: Deploy DR download landing

on:
  push:
    branches:
      - main
    paths:
      - 'landing/descargar/**'
      - 'scripts/deploy_download_landing.py'
      - '.github/workflows/deploy-download-landing.yml'
      - 'landing-deploy-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-download-landing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Deploy branded download landing
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_download_landing.py
