name: Expire DR Radar alerts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/expire_radar_alerts.py'
      - '.github/workflows/expire-radar-alerts.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-auto-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Expire DR Radar alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/expire_radar_alerts.py
