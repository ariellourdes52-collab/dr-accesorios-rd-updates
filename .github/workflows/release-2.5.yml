name: Release DR Accesorios RD 2.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-2.5.yml'
  schedule:
    # 2026-12-31 00:00 UTC = 2026-12-30 20:00 America/Santo_Domingo
    - cron: '0 0 31 12 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-2.5 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release date safety gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-12-31" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-2.5" ]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Workflow self-check
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "release-2.5.yml parsed correctly."
          echo "Safety gate kept the release disabled for this push."

      - name: Prepare or sync v2.5 draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.5") | .id' | head -n 1)"

          cat > /tmp/v25-body.md <<'BODY'
          DR Accesorios RD v2.5 — Nuestro regalo de Año Nuevo 🎁✨

          Para cerrar 2026 y recibir el nuevo año, queremos compartir contigo nuestro regalo de Año Nuevo de parte de DR Accesorios RD: una versión enfocada en hacer que leer, escuchar e interactuar con nuestras noticias se sienta más moderno, rápido y coherente.

          • 📰 Nuevo lector nativo evolucionado con Jetpack Compose + Material 3.

          • 🎨 Cabecera, cuerpo del artículo, imágenes, progreso de lectura, barra superior, acciones y pie del lector renovados con una línea visual más uniforme.

          • 🎧 DR Audio integrado de forma más natural dentro del lector, ahora minimizado por defecto y expandible cuando lo necesites.

          • 💬 Comunidad renovada: comentarios, respuestas, likes, editor, estados de carga y controles principales migrados a Compose.

          • 📴 Nuevo diálogo Compose para artículos guardados sin conexión, con acciones claras para mantener o quitar la descarga.

          • 🌙 Mejor adaptación al modo claro, oscuro y seguir sistema en los componentes renovados.

          • 📰 Artículos relacionados mejorados con imágenes 16:9 completas y una presentación más limpia.

          • ⚡ Optimización profunda del rendimiento del lector: menos recomposiciones, carga escalonada de elementos secundarios y mejor respuesta durante el desplazamiento.

          • 📖 Continuar leyendo, favoritos y lectura offline conservan su funcionamiento dentro de la nueva arquitectura.

          • 🔔 Centro de Notificaciones ajustado para respetar correctamente el tema elegido dentro de la app.

          • 🧹 Limpieza interna del proyecto, eliminación de componentes heredados sin uso y mantenimiento de las dependencias realmente necesarias.

          La v2.5 no busca llenar la app de funciones nuevas por llenar. Es una evolución de calidad: más Compose, más coherencia, más fluidez y una base más preparada para lo que viene en 2027.

          🎁 **Nuestro regalo de Año Nuevo para ti, de parte de DR Accesorios RD.**

          ---

          **Archivo:** `dr-accesorios-rd.apk`

          **SHA-256:** `e3097730a98b66dba7917fcea4e95ca5bc90d356905769c1d0eea05ead46457b`
          BODY

          if [ -z "$RELEASE_ID" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="2.5" \
              -f target_commitish="main" \
              -f name="DR Accesorios RD v2.5 — Nuestro regalo de Año Nuevo 🎁✨" \
              -F draft=true \
              -F prerelease=false \
              --raw-field body="$(cat /tmp/v25-body.md)"
            echo "Draft 2.5 created."
            exit 0
          fi

          IS_DRAFT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release 2.5 is no longer a draft; metadata sync skipped."
            exit 0
          fi

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field tag_name="2.5" \
            --raw-field name="DR Accesorios RD v2.5 — Nuestro regalo de Año Nuevo 🎁✨" \
            --raw-field body="$(cat /tmp/v25-body.md)"

          echo "Draft 2.5 metadata synchronized."

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 19,
            "versionName": "2.5",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "🎁 Nuestro regalo de Año Nuevo de parte de DR Accesorios RD\n📰 Lector nativo evolucionado con Jetpack Compose + Material 3\n🎧 DR Audio minimizable e integrado al lector\n💬 Comentarios, respuestas y controles renovados con Compose\n📴 Nuevo diálogo Compose para artículos guardados\n⚡ Rendimiento del lector profundamente optimizado\n📰 Artículos relacionados con imágenes 16:9 mejoradas\n🌙 Mejor soporte de temas claro, oscuro y sistema\n📖 Continuar leyendo y lectura offline preservados\n🧹 Limpieza interna y mayor estabilidad"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 19 --version-name 2.5 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.5") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 2.5 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          EXPECTED_DIGEST="sha256:e3097730a98b66dba7917fcea4e95ca5bc90d356905769c1d0eea05ead46457b"

          if [[ "$EXPECTED_DIGEST" != sha256:* ]]; then
            echo "Final v2.5 APK SHA-256 is locked in release-2.5.yml."
            echo "Found uploaded APK digest: $APK_DIGEST"
            exit 1
          fi

          if [ "$APK_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK digest mismatch."
            echo "Expected: $EXPECTED_DIGEST"
            echo "Found:    $APK_DIGEST"
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 2.5 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 19 --version-name 2.5 --legacy-max-version-code 14

      - name: Legacy 1.6/1.7 delivery reminder
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          echo "::warning::Versions 1.6 and 1.7 are not covered by the Firestore registry. Send the two Firebase Notifications composer campaigns targeted strictly by App version after this release. See docs/legacy-update-delivery.md."
          {
            echo "### Legacy update delivery still required"
            echo ""
            echo "Versions **1.6** and **1.7** must receive separate Firebase Notifications composer campaigns targeted strictly by **App version**."
            echo ""
            echo "Follow `docs/legacy-update-delivery.md`. Do not use a notification payload on the shared `blog_updates` topic."
          } >> "$GITHUB_STEP_SUMMARY"
