name: Release DR Accesorios RD 1.8

on:
  schedule:
    # 2026-10-01 00:00 UTC = 2026-09-30 20:00 America/Santo_Domingo
    - cron: '0 0 1 10 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-1.8 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release date safety gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-10-01" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-1.8" ]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 9,
            "versionName": "1.8",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "📡 Llega DR Radar por primera vez\n🔔 Nuevas alertas de Radar dentro de la aplicación\n📱 Mejoras generales en la experiencia de uso\n⚡ Ajustes de rendimiento y estabilidad\n🛠️ Correcciones internas y optimizaciones"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 9 --version-name 1.8 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100"             --jq '.[] | select(.tag_name=="1.8") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 1.8 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"             --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          if [ "$APK_DIGEST" != "sha256:09e32508001d9fe4455e951031f2636cc90b9fb65805946ee6a2cfbe2c6b63e3" ]; then
            echo "APK digest differs from the previously verified release asset."
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 1.8 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}"             -F draft=false             -F prerelease=false             -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 9 --version-name 1.8 --legacy-max-version-code 14
