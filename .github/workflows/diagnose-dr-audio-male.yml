name: Diagnose DR Audio male voice

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-dr-audio-male.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect live DR Audio catalog and male assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          index_url = "https://dr-accesorios-rd.web.app/dr-audio/index.json"
          req = urllib.request.Request(index_url, headers={"User-Agent":"DR-Audio-Diagnostics/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          entries = data.get("entries") or []
          latest = entries[:5]
          report = {
              "schemaVersion": data.get("schemaVersion"),
              "generatedAt": data.get("generatedAt"),
              "voices": data.get("voices"),
              "latestCount": data.get("latestCount"),
              "latestMaleReady": data.get("latestMaleReady"),
              "historyCount": data.get("historyCount"),
              "latest": [],
          }

          for e in latest:
              male = (e.get("audioMaleUrl") or "").strip()
              female = (e.get("audioFemaleUrl") or e.get("audioUrl") or "").strip()
              item = {
                  "title": e.get("title"),
                  "url": e.get("url"),
                  "femaleReady": bool(female),
                  "femaleVoice": e.get("femaleVoice") or e.get("voice"),
                  "femaleUrl": female or None,
                  "femaleHttpStatus": None,
                  "femaleContentLength": None,
                  "femaleContentType": None,
                  "femaleHttpError": None,
                  "maleReady": bool(male),
                  "maleVoice": e.get("maleVoice"),
                  "maleContentHash": e.get("maleContentHash"),
                  "maleBytes": e.get("maleBytes"),
                  "maleUrl": male or None,
                  "maleHttpStatus": None,
                  "maleContentLength": None,
                  "maleContentType": None,
                  "maleHttpError": None,
              }
              if female:
                  try:
                      head = urllib.request.Request(female, method="HEAD", headers={"User-Agent":"DR-Audio-Diagnostics/1.0"})
                      with urllib.request.urlopen(head, timeout=30) as hr:
                          item["femaleHttpStatus"] = hr.status
                          item["femaleContentLength"] = hr.headers.get("Content-Length")
                          item["femaleContentType"] = hr.headers.get("Content-Type")
                  except Exception as ex:
                      item["femaleHttpError"] = repr(ex)
              if male:
                  try:
                      head = urllib.request.Request(male, method="HEAD", headers={"User-Agent":"DR-Audio-Diagnostics/1.0"})
                      with urllib.request.urlopen(head, timeout=30) as hr:
                          item["maleHttpStatus"] = hr.status
                          item["maleContentLength"] = hr.headers.get("Content-Length")
                          item["maleContentType"] = hr.headers.get("Content-Type")
                  except Exception as ex:
                      item["maleHttpError"] = repr(ex)
              report["latest"].append(item)

          report["latestMaleUrlsReadyComputed"] = sum(1 for x in report["latest"] if x["maleReady"])
          Path("diagnostics/dr-audio-male.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Set up Python for Gemini quota probe
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gemini probe dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet google-genai

      - name: Probe Gemini TTS quota with same DR Audio key
        env:
          GEMINI_API_KEY_DR_AUDIO: '${{ secrets.GEMINI_API_KEY_DR_AUDIO }}'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics

          set +e
          timeout --signal=TERM --kill-after=5s 45s python - <<'PY' > diagnostics/gemini-tts-probe.txt 2>&1
          import os
          import sys
          from google import genai

          key = os.environ.get("GEMINI_API_KEY_DR_AUDIO", "").strip()
          if not key:
              print("RESULT=MISSING_KEY")
              raise SystemExit(2)

          client = genai.Client(api_key=key)

          try:
              interaction = client.interactions.create(
                  model="gemini-3.8-flash-lite-tts",
                  timeout=30,
                  input=[
                      {
                          "type": "user_input",
                          "content": [
                              {
                                  "type": "text",
                                  "text": "Prueba de cuota DR Audio.",
                                  "annotations": [
                                      {
                                          "type": "speech_metadata",
                                          "style": "Voz femenina natural, clara y breve en español latino neutro.",
                                      }
                                  ],
                              }
                          ],
                      }
                  ],
                  response_format={"type": "audio"},
                  generation_config={
                      "speech_config": [
                          {"voice": "Achernar"},
                      ]
                  },
              )
              output_audio = getattr(interaction, "output_audio", None)
              data = getattr(output_audio, "data", None)
              if not data:
                  print("RESULT=NO_AUDIO")
                  raise SystemExit(3)

              print("RESULT=OK")
              print("Gemini TTS returned audio for the minimal probe.")
          except Exception as exc:
              message = f"{type(exc).__name__}: {exc}"
              upper = message.upper()
              if (
                  "RESOURCE_EXHAUSTED" in upper
                  or "429" in upper
                  or "QUOTA" in upper and ("EXCEEDED" in upper or "EXHAUSTED" in upper)
              ):
                  print("RESULT=QUOTA_EXHAUSTED")
              else:
                  print("RESULT=API_ERROR")
              print(message)
              raise
          PY
          code=$?
          set -e

          if [[ "$code" -eq 124 || "$code" -eq 137 || "$code" -eq 143 ]]; then
            echo "RESULT=TIMEOUT" > diagnostics/gemini-tts-probe.txt
            echo "Gemini TTS probe did not return within 45 seconds." >> diagnostics/gemini-tts-probe.txt
          fi

          cat diagnostics/gemini-tts-probe.txt

      - name: Upload Gemini quota probe
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tts-quota-probe
          path: diagnostics/gemini-tts-probe.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: dr-audio-male-diagnostic
          path: diagnostics/dr-audio-male.json
          if-no-files-found: error
          retention-days: 7
