name: Recover DR Audio from pre-incident release

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/recover_dr_audio_from_release.py'
      - '.github/workflows/recover-dr-audio-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SITE_ID: dr-accesorios-rd
      PROJECT_ID: dr-accesorios-rd
      RECOVERY_RELEASE_ID: '1791038062787000'
      RECOVERY_CHANNEL_ID: dr-audio-recovery-609
      FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recovery dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            google-auth requests beautifulsoup4 httpx

      - name: Prepare Firebase service account
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ["FIREBASE_SERVICE_ACCOUNT"].strip()
          data = json.loads(raw)
          path = Path(".firebase-recovery-sa.json").resolve()
          path.write_text(json.dumps(data), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"GOOGLE_APPLICATION_CREDENTIALS={path}\n")
          PY

      - name: Resolve historical Firebase version
        id: historical
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          site = os.environ["SITE_ID"]
          release_id = os.environ["RECOVERY_RELEASE_ID"]
          raw = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(
              raw,
              scopes=["https://www.googleapis.com/auth/firebase.hosting"],
          )
          session = AuthorizedSession(creds)
          url = (
              "https://firebasehosting.googleapis.com/v1beta1/"
              f"sites/{site}/releases/{release_id}"
          )
          response = session.get(url, timeout=60)
          response.raise_for_status()
          release = response.json()
          version_name = str((release.get("version") or {}).get("name") or "")
          if not version_name:
              raise RuntimeError("Historical release did not expose a version name")
          version_id = version_name.rsplit("/", 1)[-1]
          print(f"Historical release: {release.get('name')}")
          print(f"Historical version: {version_name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_id={version_id}\n")
          PY

      - name: Expose historical version on temporary preview channel
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          base = "https://firebasehosting.googleapis.com/v1beta1/"
          site = os.environ["SITE_ID"]
          channel_id = os.environ["RECOVERY_CHANNEL_ID"]
          version_id = "${{ steps.historical.outputs.version_id }}"
          version_name = f"sites/{site}/versions/{version_id}"
          channel_name = f"sites/{site}/channels/{channel_id}"

          raw = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(
              raw,
              scopes=["https://www.googleapis.com/auth/firebase.hosting"],
          )
          session = AuthorizedSession(creds)

          existing = session.get(base + channel_name, timeout=60)
          if existing.status_code == 404:
              created = session.post(
                  base + f"sites/{site}/channels",
                  params={"channelId": channel_id},
                  json={"ttl": "3600s"},
                  timeout=60,
              )
              created.raise_for_status()
          else:
              existing.raise_for_status()

          release = session.post(
              base + channel_name + "/releases",
              params={"versionName": version_name},
              json={"message": "Temporary DR Audio historical recovery"},
              timeout=90,
          )
          release.raise_for_status()

          channel = session.get(base + channel_name, timeout=60)
          channel.raise_for_status()
          data = channel.json()
          url = str(data.get("url") or "").rstrip("/")
          if not url:
              raise RuntimeError("Firebase preview channel did not expose a URL")

          print(f"Recovery preview: {url}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"url={url}\n")
          PY

      - name: Recover reusable historical DR Audio voices
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_dr_audio_from_release.py \
            --preview-base-url "${{ steps.preview.outputs.url }}" \
            --output dr_audio_recovery_build

      - name: Deploy recovered DR Audio preserving all other Hosting files
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/deploy_shared_dr_audio.py dr_audio_recovery_build

      - name: Verify full historical DR Audio recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          manifest = json.loads(
              Path("dr_audio_recovery_build/recovery-manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          url = "https://dr-accesorios-rd.web.app/dr-audio/index.json"
          response = requests.get(
              url,
              params={"verify": time.time_ns()},
              headers={"Cache-Control": "no-cache"},
              timeout=30,
          )
          response.raise_for_status()
          data = response.json()

          entries = [
              entry
              for entry in (data.get("entries") or [])
              if isinstance(entry, dict) and entry.get("url")
          ]
          final_urls = {
              str(entry.get("url") or "").split("?", 1)[0].split("#", 1)[0].rstrip("/")
              for entry in entries
          }

          expected_count = int(manifest["expectedFinalCount"])
          history_count = int(data.get("historyCount") or 0)

          if len(entries) != expected_count or history_count != expected_count:
              raise RuntimeError(
                  "Historical recovery count mismatch: "
                  f"entries={len(entries)}, historyCount={history_count}, "
                  f"expected={expected_count}"
              )

          missing_historical = set(manifest["historicalUrls"]) - final_urls
          missing_live = set(manifest["liveUrls"]) - final_urls
          if missing_historical:
              raise RuntimeError(
                  "Historical URLs still missing after recovery: "
                  + " | ".join(sorted(missing_historical)[:10])
              )
          if missing_live:
              raise RuntimeError(
                  "Current live URLs were lost during recovery: "
                  + " | ".join(sorted(missing_live)[:10])
              )

          live_top_urls = manifest["liveTopUrls"]
          final_top_urls = [
              str(entry.get("url") or "").split("?", 1)[0].split("#", 1)[0].rstrip("/")
              for entry in entries[: len(live_top_urls)]
          ]
          if final_top_urls != live_top_urls:
              raise RuntimeError(
                  "Newest live DR Audio order changed during historical recovery"
              )

          all_audio_paths = sorted(
              set(manifest["historicalAudioPaths"])
              | set(manifest["liveAudioPaths"])
          )

          for path in all_audio_paths:
              audio_url = "https://dr-accesorios-rd.web.app" + path
              check = requests.head(
                  audio_url,
                  params={"verify": time.time_ns()},
                  headers={"Cache-Control": "no-cache"},
                  timeout=30,
                  allow_redirects=True,
              )
              if not check.ok:
                  raise RuntimeError(
                      f"Recovered audio unreachable HTTP {check.status_code}: {path}"
                  )

          print(
              "VERIFIED FULL DR AUDIO HISTORY: "
              f"historical_source={manifest['historicalCount']}, "
              f"live_before={manifest['liveCountBeforeRecovery']}, "
              f"live_after={history_count}, "
              f"audio_assets_verified={len(all_audio_paths)}"
          )
          PY

      - name: Delete temporary preview channel
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          base = "https://firebasehosting.googleapis.com/v1beta1/"
          site = os.environ["SITE_ID"]
          channel_id = os.environ["RECOVERY_CHANNEL_ID"]
          raw = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(
              raw,
              scopes=["https://www.googleapis.com/auth/firebase.hosting"],
          )
          session = AuthorizedSession(creds)
          response = session.delete(
              base + f"sites/{site}/channels/{channel_id}",
              timeout=60,
          )
          if response.status_code not in (200, 204, 404):
              print(
                  f"WARNING: temporary channel cleanup HTTP {response.status_code}: "
                  f"{response.text[:500]}"
              )
          else:
              print("Temporary recovery channel removed.")
          PY

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f .firebase-recovery-sa.json
