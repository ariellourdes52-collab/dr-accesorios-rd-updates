name: DR Audio English female (isolated)

on:
  pull_request:
    paths:
      - 'scripts/generate_dr_audio_english.py'
      - 'scripts/deploy_shared_dr_audio.py'
      - 'tests/test_dr_audio_english*.py'
      - '.github/workflows/generate-dr-audio-english.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE-DR-AUDIO-EN for ONE new English female audio'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-genai google-auth requests beautifulsoup4 httpx
      - name: Verify English code offline without Gemini or Firebase
        run: |
          python -m py_compile scripts/generate_dr_audio_english.py scripts/deploy_shared_dr_audio.py
          python -m unittest discover -s tests -p 'test_dr_audio_english*.py' -v
      - name: Verify dedicated English key can access required models (no generation)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ENGLISH_KEY: '${{ secrets.GEMINI_API_KEY_DR_AUDIO_EN }}'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.getenv("ENGLISH_KEY", "").strip()
          if not key:
              raise SystemExit("English-only GitHub secret missing or empty")
          models = (
              "gemini-3.8-flash-lite-tts",
              "gemini-3.5-flash-lite",
          )
          for model in models:
              url = "https://generativelanguage.googleapis.com/v1beta/models/" + model
              req = urllib.request.Request(
                  url, headers={"x-goog-api-key": key, "Accept": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = json.load(response)
                      if str(data.get("name", "")).split("/")[-1] != model:
                          raise ValueError("Unexpected Gemini model metadata")
                      print(f"English-only API key: model {model} accessible (HTTP 200)")
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"English-only key cannot access {model}: HTTP {error.code}"
                  ) from None
          print("Metadata checks only; zero TTS/translation requests; no deploy")
          PY


  english:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'GENERATE-DR-AUDIO-EN'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production TTS dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet google-genai google-auth requests beautifulsoup4 httpx
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate one English narration; Spanish stays unchanged
        env:
          GEMINI_API_KEY_DR_AUDIO_EN: '${{ secrets.GEMINI_API_KEY_DR_AUDIO_EN }}'
          GITHUB_REF: '${{ github.ref }}'
        run: |
          python scripts/generate_dr_audio_english.py \
            --mode generate \
            --confirm GENERATE-DR-AUDIO-EN \
            --output dr_audio_english_build
      - name: Deploy English overlay preserving live Hosting files
        if: hashFiles('dr_audio_english_build/dr-audio/index.json') != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/deploy_shared_dr_audio.py dr_audio_english_build --english-overlay
