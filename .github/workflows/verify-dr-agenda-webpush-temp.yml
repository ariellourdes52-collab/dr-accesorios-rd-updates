name: DR Agenda Web Push - verification only (temporary)
on:
  push:
    branches:
      - fix/dr-agenda-webpush-consent-20261013
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
jobs:
  agenda-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unit test dependencies only
        run: python -m pip install --disable-pip-version-check --quiet 'requests>=2.31,<3' 'google-auth>=2.29,<3' 'Pillow>=10,<13'
      - name: DR Agenda regression + safety tests (no deployments)
        run: |
          python -m compileall -q scripts/dr_agenda_publisher_core.py scripts/publish_dr_agenda_telegram.py tests/test_dr_agenda_ios_webpush.py
          python -m unittest discover -s tests -p 'test_dr_agenda_guardrails.py' -v
          python -m unittest discover -s tests -p 'test_agenda_hosting_isolation.py' -v
          python -m unittest discover -s tests -p 'test_dr_agenda_fcm.py' -v
          python -m unittest discover -s tests -p 'test_dr_agenda_ios_webpush.py' -v
