name: Release DR Accesorios RD 2.7
# v2.7 APK uses versionCode 23. A Store build with code 23 cannot upgrade to this code; build code 24+ for Store upgrade.
# Protect v2.5 (code 21) and v2.4.1 (code 20) from rollback.
# The SHA-256 of the supplied v2.7 APK was verified locally.
# Confirm Android signing-certificate compatibility and perform an on-device test before release.

# Official v2.7 publication: 2026-11-18 20:00 America/Santo_Domingo
# GitHub Actions cron is UTC, so that is 2026-11-19 00:00 UTC.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-2.7.yml'
  schedule:
    - cron: '0 0 19 11 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-2.7 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release date safety gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-11-19" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-2.7" ] && [[ "$(date -u +%Y-%m-%d)" > "2026-11-18" ]]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Workflow self-check
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "release-2.7.yml parsed correctly."
          echo "Safety gate kept the release disabled for this push."

      - name: Prepare or sync v2.7 draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.7") | .id' | head -n 1)"

          cat > /tmp/v27-body.md <<'BODY'
          # 🚀 DR Accesorios RD v2.7 — ¡Más tecnología, información y conectividad!
          
          💗 Seguimos evolucionando. DR Accesorios RD reúne noticias tecnológicas, alertas sísmicas, audio, agenda y comunidad en una sola aplicación. Esta versión consolida los módulos principales y su integración con los servicios de contenido y notificaciones.
          
          ## 🆕 Mejoras de servicios del 4 de noviembre
          
          - 📡 **DR Radar:** se incorporó en la infraestructura de distribución un canal para eventos preliminares EMSC mediante mensajes de datos FCM de prioridad alta, complementando las fuentes sísmicas existentes. La recepción real en cada dispositivo depende de conectividad, permisos y compatibilidad.
          - 🔄 **Actualizaciones:** mantenimiento del servicio de distribución después de resolver el problema de almacenamiento de Firebase que afectaba las actualizaciones.
          - 🛡️ **Seguimiento técnico:** supervisión de la entrega de contenido y notificaciones. Los ajustes de sirena y vibración de USGS/EMSC preparados para Android aún requieren validación en un APK final; no se anuncian aquí como función ya incorporada.
          
          ## 📰 DR NOTICIAS — Información tecnológica
          
          - 📰 Acceso directo a publicaciones de DR Accesorios RD y lector nativo.
          - 🌐 Integración con Blogger, actualización de contenido y enlaces a las fuentes originales.
          - 🌎 Soporte de traducción en la experiencia de lectura.
          - 📖 Consulta de artículos desde la aplicación.
          
          ## 📡 DR RADAR — Información sísmica y alertas
          
          - 🌋 Monitoreo sísmico mediante la infraestructura DR Radar y SeedLink.
          - 🇩🇴 Estaciones y referencias de República Dominicana.
          - 🌍 Integración de fuentes internacionales USGS y EMSC.
          - 🔔 Distribución de avisos con Firebase Cloud Messaging.
          - 🛡️ Supervisión, deduplicación y mecanismos de recuperación de servicios.
          
          **Importante:** DR Radar informa sobre eventos sísmicos detectados; no predice terremotos ni sustituye los sistemas oficiales de alerta temprana.
          
          ## 📅 DR AGENDA — Actividades y eventos
          
          - 🗓️ Acceso a agenda, eventos y actividades programadas.
          - 🔄 Integración con los servicios de contenido y acceso desde la aplicación.
          
          ## 🎧 DR AUDIO — Tecnología para escuchar
          
          - 🎵 Reproductor de audio con controles integrados.
          - ▶️ Integración con MediaSessionService de Android.
          - 🎛️ Controles multimedia desde notificaciones y superficies compatibles del sistema.
          - 🎧 Soporte de reproducción en segundo plano y mantenimiento de las acciones del reproductor.
          
          ## 💬 COMUNIDAD — Participa y comparte
          
          - 💬 Comentarios, respuestas e interacciones mediante likes.
          - 🗑️ Administración y eliminación de comentarios propios.
          - 🔐 Acceso con Google.
          - 🛡️ Protección de servicios compatibles con Firebase App Check y Play Integrity.
          
          ## 🔔 NOTIFICACIONES
          
          - 📲 Recepción de avisos mediante Firebase Cloud Messaging.
          - 📰 Alertas sobre publicaciones y contenido nuevo.
          - 📡 Integración con DR Radar y canales de notificaciones.
          - ⚙️ Servicios de recepción y procesamiento de avisos.
          
          ## 🌐 CONECTIVIDAD, ESTADÍSTICAS Y WEB
          
          - 🔥 Integración con Firebase y servicios web.
          - 📊 Google Analytics 4 y métricas de uso de noticias, lectura y notificaciones.
          - 🍎 Acceso a la Web App para iOS.
          
          ## 🔄 ACTUALIZACIONES — CANAL GITHUB
          
          - 🚀 Distribución oficial mediante GitHub Releases.
          - 📦 Descarga del APK mediante el enlace permanente oficial.
          - 🔔 Comprobación de nuevas versiones y avisos dirigidos a instalaciones compatibles.
          - 🛠️ Canal de distribución independiente de Google Play.
          
          ## 🔐 PRIVACIDAD Y SEGURIDAD
          
          - 🔐 Autenticación para funciones que requieren identificación.
          - 🛡️ Mecanismos de protección de Firebase.
          - 📱 Compatibilidad desde Android API 24.
          - 🔒 Mantenimiento de la comunicación con servicios integrados.
          
          ## ⚙️ MEJORAS GENERALES
          
          - 🧩 Integración y mantenimiento de módulos.
          - 📲 Experiencia de navegación y consumo de contenido.
          - 🔄 Mantenimiento de servicios de noticias y notificaciones.
          - 🎧 Ajustes internos relacionados con la experiencia multimedia.
          - 🛠️ Base preparada para futuras mejoras.
          
          ---
          
          **📅 Lanzamiento oficial programado:** 18 de noviembre de 2026, 8:00 p. m. (República Dominicana).
          
          **📦 APK:** dr-accesorios-rd.apk
          
          **🔐 SHA-256:** 748a45bb3105ac1047e1fc5057b008b171a77c078d6190895a86804591b83681
          
          **ℹ️ Nota de compatibilidad:** este APK usa versionName 2.7 y versionCode 23. Puede actualizar versiones de GitHub con código inferior si la firma coincide. No reemplaza como actualización superior a otra instalación cuyo versionCode ya sea 23.
          
          💗 **DR ACCESORIOS RD**
          
          Tecnología, información y conectividad en un solo lugar. Gracias por formar parte de nuestra comunidad. ¡Seguimos avanzando!
          BODY

          if [ -z "$RELEASE_ID" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="2.7" \
              -f target_commitish="main" \
              -f name="DR Accesorios RD v2.7 — Más tecnología, información y conectividad 🚀" \
              -F draft=true \
              -F prerelease=false \
              --raw-field body="$(cat /tmp/v27-body.md)"
            echo "Draft 2.7 created."
            exit 0
          fi

          IS_DRAFT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release 2.7 is no longer a draft; metadata sync skipped."
            exit 0
          fi

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field tag_name="2.7" \
            --raw-field name="DR Accesorios RD v2.7 — Más tecnología, información y conectividad 🚀" \
            --raw-field body="$(cat /tmp/v27-body.md)"

          echo "Draft 2.7 metadata synchronized."

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 23,
            "versionName": "2.7",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "📡 Infraestructura EMSC: datos FCM de alta prioridad para avisos preliminares\n🔄 Mantenimiento del servicio de actualización tras resolver almacenamiento Firebase\n📰 DR Noticias: lector nativo, Blogger, traducción y contenido actualizado\n🌋 DR Radar: SeedLink, USGS, EMSC y alertas\n📅 DR Agenda: eventos y actividades\n🎧 DR Audio: reproducción y controles multimedia Android\n💬 Comunidad: comentarios, likes, respuestas y acceso Google\n🔔 Notificaciones FCM para publicaciones y Radar\n🛡️ App Check, Play Integrity y mantenimiento de seguridad"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 23 --version-name 2.7 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.7") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 2.7 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          EXPECTED_DIGEST="sha256:748a45bb3105ac1047e1fc5057b008b171a77c078d6190895a86804591b83681"

          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::v2.7 signed APK SHA-256 has not been pinned. Refusing publication."
            exit 1
          fi

          if [ "$APK_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK digest mismatch."
            echo "Expected: $EXPECTED_DIGEST"
            echo "Found:    $APK_DIGEST"
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 2.7 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 23 --version-name 2.7 --legacy-max-version-code 14

      - name: Legacy 1.6/1.7 delivery reminder
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          echo "::warning::Versions 1.6 and 1.7 are not covered by the Firestore registry. Send the two Firebase Notifications composer campaigns targeted strictly by App version after this release. See docs/legacy-update-delivery.md."
          {
            echo "### Legacy update delivery still required"
            echo ""
            echo "Versions **1.6** and **1.7** must receive separate Firebase Notifications composer campaigns targeted strictly by **App version**."
            echo ""
            echo "Follow `docs/legacy-update-delivery.md`. Do not use a notification payload on the shared `blog_updates` topic."
          } >> "$GITHUB_STEP_SUMMARY"
