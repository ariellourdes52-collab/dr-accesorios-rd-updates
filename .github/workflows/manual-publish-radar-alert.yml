name: Publicar alerta DR Radar segura

run-name: >-
  DR Radar · publicar · ${{ inputs.alert_id }} · ${{ inputs.title }}

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: 'ID único de la alerta'
        required: true
        type: string
      title:
        description: 'Título'
        required: true
        type: string
      description:
        description: 'Descripción'
        required: true
        type: string
      url:
        description: 'Enlace https:// o NINGUNO'
        required: false
        default: 'NINGUNO'
        type: string
      severity:
        description: 'Severidad'
        required: true
        type: choice
        default: warning
        options:
          - info
          - warning
          - critical
      category:
        description: 'Categoría'
        required: true
        type: choice
        default: general
        options:
          - general
          - tech
          - service
          - outage
          - weather
      duration_minutes:
        description: 'Duración en minutos'
        required: true
        type: choice
        default: '120'
        options:
          - '30'
          - '60'
          - '120'
          - '360'
          - '720'
          - '1440'

permissions:
  contents: read

concurrency:
  group: dr-radar-manual-write
  cancel-in-progress: false

jobs:
  publish-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Publicar alerta preservando todo Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
          RADAR_ALERT_ID: '${{ inputs.alert_id }}'
          RADAR_TITLE: '${{ inputs.title }}'
          RADAR_DESCRIPTION: '${{ inputs.description }}'
          RADAR_URL: '${{ inputs.url }}'
          RADAR_SEVERITY: '${{ inputs.severity }}'
          RADAR_CATEGORY: '${{ inputs.category }}'
          RADAR_DURATION_MINUTES: '${{ inputs.duration_minutes }}'
        run: python scripts/manual_publish_radar_alert.py
