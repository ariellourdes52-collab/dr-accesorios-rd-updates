name: DR Noticias Tech - X validar OAuth sin publicar
run-name: DR Noticias Tech - X autenticacion (solo lectura)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/dr_noticias_x_auth_check.py'
      - 'tests/test_dr_noticias_x_auth_check.py'
      - '.github/workflows/dr-noticias-x-auth-check.yml'

permissions:
  contents: read

concurrency:
  group: dr-noticias-x-auth-check
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'requests-oauthlib>=2,<3'
      - name: Tests offline sin uso de X API
        run: |
          python -m py_compile scripts/dr_noticias_x_auth_check.py
          python -m unittest discover -s tests -p 'test_dr_noticias_x_auth_check.py' -v

  authenticated-user:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'requests-oauthlib>=2,<3'
      - name: UNA consulta GET /2/users/me, sin publicaciones ni subida de imagen
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/dr_noticias_x_auth_check.py
