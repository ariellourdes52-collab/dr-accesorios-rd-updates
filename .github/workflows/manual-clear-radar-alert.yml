name: Quitar última alerta DR Radar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-manual-clear
  cancel-in-progress: false

jobs:
  clear-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Quitar última alerta activa de DR Radar
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/manual_clear_radar_alert.py --latest-active
