name: Clean stale FCM registrations for v2.4.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-stale-fcm-2.4.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Send v2.4.1 update and prune confirmed NotRegistered devices
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: >
          python scripts/send_update_notifications.py
          --version-code 20
          --version-name 2.4.1
          --legacy-max-version-code 14
          --prune-not-registered

      - name: Verify remaining registration inventory
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: >
          python scripts/send_update_notifications.py
          --version-code 20
          --version-name 2.4.1
          --legacy-max-version-code 14
          --preflight
