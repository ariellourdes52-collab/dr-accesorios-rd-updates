name: DR Noticias Tech - Facebook Page Token (solo lectura)
run-name: DR Noticias Tech - Facebook identidad de pagina

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/dr_noticias_facebook_preflight.cjs'
      - 'tests/test_dr_noticias_facebook_preflight.cjs'
      - '.github/workflows/dr-noticias-facebook-preflight.yml'

permissions:
  contents: read

concurrency:
  group: dr-noticias-facebook-token-check
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Validar sintaxis y pruebas (sin contactar Facebook)
        run: |
          node --check scripts/dr_noticias_facebook_preflight.cjs
          node --test tests/test_dr_noticias_facebook_preflight.cjs

  page-token:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Comprobar identidad exacta de fanpage (GET, NO PUBLICAR)
        env:
          DR_NOTICIAS_FB_PAGE_TOKEN: ${{ secrets.DR_NOTICIAS_FB_PAGE_TOKEN }}
        run: node scripts/dr_noticias_facebook_preflight.cjs
