name: DR Audio Scheduler Watchdog

on:
  schedule:
    # Independent backup wake-up, offset from the primary */5 cron.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dr-audio-scheduler-watchdog.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: dr-audio-scheduler-watchdog
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake DR Audio only when the primary scheduler is stale
        env:
          GH_TOKEN: '${{ github.token }}'
          REPOSITORY: '${{ github.repository }}'
          TARGET_WORKFLOW: generate-dr-audio.yml
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          workflow = os.environ["TARGET_WORKFLOW"]
          api = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "DR-Audio-Scheduler-Watchdog",
          }

          def request_json(url, method="GET", payload=None):
              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      return json.loads(raw.decode("utf-8"))
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {url} failed HTTP "
                      f"{error.code}: {detail[:1000]}"
                  ) from error

          runs = request_json(
              f"{api}/actions/workflows/{workflow}/runs?per_page=20"
          ) or {}
          workflow_runs = list(runs.get("workflow_runs") or [])

          active = [
              run
              for run in workflow_runs
              if run.get("status") in {
                  "queued",
                  "in_progress",
                  "pending",
                  "waiting",
                  "requested",
              }
          ]
          if active:
              newest = active[0]
              print(
                  "Primary DR Audio workflow is already active: "
                  f"run #{newest.get('run_number')} "
                  f"({newest.get('status')}). No watchdog dispatch needed."
              )
              raise SystemExit(0)

          now = datetime.now(timezone.utc)
          newest = workflow_runs[0] if workflow_runs else None
          if newest:
              created_raw = str(newest.get("created_at") or "")
              created = datetime.fromisoformat(
                  created_raw.replace("Z", "+00:00")
              )
              age_seconds = (now - created.astimezone(timezone.utc)).total_seconds()

              if age_seconds < 8 * 60:
                  print(
                      "Primary DR Audio workflow ran recently: "
                      f"run #{newest.get('run_number')} started "
                      f"{int(age_seconds)}s ago. No watchdog dispatch needed."
                  )
                  raise SystemExit(0)

              print(
                  "Primary DR Audio scheduler is stale: "
                  f"last run #{newest.get('run_number')} started "
                  f"{int(age_seconds)}s ago."
              )
          else:
              print("No previous DR Audio workflow run found.")

          request_json(
              f"{api}/actions/workflows/{workflow}/dispatches",
              method="POST",
              payload={
                  "ref": "main",
                  "inputs": {
                      "confirm": "GENERATE-DR-AUDIO",
                      "backfill_count": "0",
                      "scheduler_guard": "true",
                  },
              },
          )
          print(
              "Watchdog dispatched Generate shared DR Audio with "
              "scheduled-run duplicate protection enabled."
          )
          PY
