name: Release DR Accesorios RD 1.7

on:
  schedule:
    # 2026-09-24 00:00 UTC = 2026-09-23 20:00 America/Santo_Domingo
    - cron: '0 0 24 9 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-1.7 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-release-1-7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Release date safety gate
        id: gate
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-09-24" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm }}" = "RELEASE-1.7" ]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Verify draft release and APK
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100"             --jq '.[] | select(.tag_name=="1.7" and .draft==true) | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Draft release 1.7 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"             --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 1.7 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}"             -F draft=false             -F prerelease=false             -f make_latest=true

      - name: Verify permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"

          for attempt in {1..18}; do
            if curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "APK URL is live."
              exit 0
            fi
            sleep 10
          done

          echo "The permanent APK URL did not become available."
          exit 1

      - name: Prepare Firebase Hosting payload
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          # Preserve the legacy Firebase-hosted APK if it still exists.
          if ! curl --fail --silent --show-error --location             "https://dr-accesorios-rd.web.app/dr-accesorios-rd.apk"             -o public/dr-accesorios-rd.apk; then
            rm -f public/dr-accesorios-rd.apk
          fi

          cat > public/version.json <<'JSON'
          {
            "versionCode": 8,
            "versionName": "1.7",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "🔄 Desliza para actualizar\n💬 Acceso directo a WhatsApp\n⚙️ Nuevo panel de información y ajustes\n🔍 Búsqueda manual de actualizaciones\n🧹 Gestión y tamaño de caché\n📴 Aviso automático sin conexión\n💾 Mejor experiencia con contenido guardado"
          }
          JSON

          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "/version.json",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "no-cache, no-store, must-revalidate"
                    }
                  ]
                }
              ]
            }
          }
          JSON

      - name: Deploy version 1.7 to Firebase Hosting
        if: steps.gate.outputs.proceed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
          channelId: live
          projectId: dr-accesorios-rd

      - name: Verify live version.json
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://dr-accesorios-rd.web.app/version.json?ts=$(date +%s)"
          LIVE_JSON="$(curl --fail --silent --show-error --location "$URL")"
          echo "$LIVE_JSON"

          echo "$LIVE_JSON" | grep -q '"versionCode": 8'
          echo "$LIVE_JSON" | grep -q '"versionName": "1.7"'

          echo "DR Accesorios RD 1.7 is live."
