name: DR Noticias Tech - Cloudflare dispatch de cuatro redes
run-name: DR Noticias Tech - Cloudflare despierta los cuatro publicadores

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dr-noticias-railway-dispatch.yml'
      - 'scripts/dr_noticias_x_auto.py'
      - 'scripts/dr_noticias_media.py'
      - 'scripts/dr_noticias_instagram_pilot.py'
      - 'tests/test_dr_noticias_x_auto.py'
      - 'tests/test_dr_noticias_github_resilience.py'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow solo para tests
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
      - name: Validar ambos publicadores offline
        run: |
          python -m py_compile scripts/dr_noticias_instagram_auto.py scripts/dr_noticias_social_auto.py
          python -m unittest discover -s tests -p 'test_dr_noticias_instagram_auto.py' -v
          python -m unittest discover -s tests -p 'test_dr_noticias_social_auto.py' -v
          python -m unittest discover -s tests -p 'test_dr_noticias_x_auto.py' -v
          python -m unittest discover -s tests -p 'test_dr_noticias_github_resilience.py' -v

  instagram:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DR_NOTICIAS_AUTO_ENABLED == 'true'
    concurrency:
      group: dr-noticias-instagram-live
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
      - name: Instagram - una nueva noticia, hasta tres por dia
        env:
          DR_NOTICIAS_IG_ACCESS_TOKEN: ${{ secrets.DR_NOTICIAS_IG_ACCESS_TOKEN }}
          DR_NOTICIAS_AUTO_ENABLED: ${{ vars.DR_NOTICIAS_AUTO_ENABLED }}
          DR_NOTICIAS_AUTO_START_UTC: ${{ vars.DR_NOTICIAS_AUTO_START_UTC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dr_noticias_instagram_auto.py --mode run

  facebook:
    needs: instagram
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DR_NOTICIAS_FB_AUTO_ENABLED == 'true'
    concurrency:
      group: dr-noticias-facebook-automatico
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
      - name: Facebook - una nueva noticia, hasta tres por dia
        env:
          DR_NOTICIAS_FB_PAGE_TOKEN: ${{ secrets.DR_NOTICIAS_FB_PAGE_TOKEN }}
          DR_NOTICIAS_FB_AUTO_ENABLED: ${{ vars.DR_NOTICIAS_FB_AUTO_ENABLED }}
          DR_NOTICIAS_AUTO_START_UTC: ${{ vars.DR_NOTICIAS_AUTO_START_UTC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dr_noticias_social_auto.py --platform facebook --mode run

  threads:
    needs: facebook
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DR_NOTICIAS_THREADS_AUTO_ENABLED == 'true'
    concurrency:
      group: dr-noticias-threads-automatico
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
      - name: Threads - una nueva noticia, hasta tres por dia
        env:
          DR_NOTICIAS_THREADS_ACCESS_TOKEN: ${{ secrets.DR_NOTICIAS_THREADS_ACCESS_TOKEN }}
          DR_NOTICIAS_THREADS_AUTO_ENABLED: ${{ vars.DR_NOTICIAS_THREADS_AUTO_ENABLED }}
          DR_NOTICIAS_AUTO_START_UTC: ${{ vars.DR_NOTICIAS_AUTO_START_UTC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dr_noticias_social_auto.py --platform threads --mode run

  x:
    # Esperar a las tres redes Meta; no bloquear X si alguna falla o está desactivada.
    needs: threads
    # Mismo workflow_dispatch de Cloudflare. No crear cron nuevo.
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.DR_NOTICIAS_X_AUTO_ENABLED == 'true'
    concurrency:
      group: dr-noticias-x-auto
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de X
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13' 'requests-oauthlib>=2,<3'
      - name: Validar X sin red antes de publicar
        run: |
          python -m py_compile scripts/dr_noticias_x_auto.py
          python -m unittest discover -s tests -p 'test_dr_noticias_x_auto.py' -v
      - name: Publicar hasta una noticia nueva y tres al dia RD, sin enlaces
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DR_NOTICIAS_X_AUTO_ENABLED: ${{ vars.DR_NOTICIAS_X_AUTO_ENABLED }}
          DR_NOTICIAS_X_LIVE_APPROVED: 'true'
          DR_NOTICIAS_X_AUTOMATIC: 'true'
          DR_NOTICIAS_X_START_UTC: ${{ vars.DR_NOTICIAS_X_START_UTC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dr_noticias_x_auto.py --mode run
