name: DR Radar Social Web Push

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/dispatch_social_webpush.py'
      - '.github/workflows/dr-radar-social-webpush.yml'
  schedule:
      - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dr-radar-social-webpush
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-cloud-firestore google-auth requests

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('dr-radar-webpush-social');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Dispatch social Web Push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python scripts/dispatch_social_webpush.py
