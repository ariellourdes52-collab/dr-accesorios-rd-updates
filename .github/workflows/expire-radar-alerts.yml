name: Expire DR Radar alerts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/expire_radar_alerts.py'
      - '.github/workflows/expire-radar-alerts.yml'

  schedule:
    # Keep each 5-minute slot as its own cron entry.
    # This preserves the 5-minute cadence while avoiding one single
    # minute-list schedule as the only trigger source.
    - cron: '2 * * * *'
    - cron: '7 * * * *'
    - cron: '12 * * * *'
    - cron: '17 * * * *'
    - cron: '22 * * * *'
    - cron: '27 * * * *'
    - cron: '32 * * * *'
    - cron: '37 * * * *'
    - cron: '42 * * * *'
    - cron: '47 * * * *'
    - cron: '52 * * * *'
    - cron: '57 * * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-auto-expire
  cancel-in-progress: true

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Expire DR Radar alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/expire_radar_alerts.py
