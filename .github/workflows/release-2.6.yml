name: Release DR Accesorios RD 2.6
# v2.6 GitHub uses versionCode 22; Store distribution uses versionCode 23.
# Protect v2.5 (code 21) and v2.4.1 (code 20) from rollback.
# BLOCKED until the v2.6 APK is built, signed with the existing key, tested,
# uploaded to its draft release, and its final SHA-256 pinned below.

# Official v2.6 publication: 2026-11-24 20:00 America/Santo_Domingo
# GitHub Actions cron is UTC, so that is 2026-11-25 00:00 UTC.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-2.6.yml'
  schedule:
    - cron: '0 0 25 11 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-2.6 to run manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release date safety gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y-%m-%d)" = "2026-11-25" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-2.6" ] && [[ "$(date -u +%Y-%m-%d)" > "2026-11-24" ]]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Workflow self-check
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "release-2.6.yml parsed correctly."
          echo "Safety gate kept the release disabled for this push."

      - name: Prepare or sync v2.6 draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.6") | .id' | head -n 1)"

          cat > /tmp/v26-body.md <<'BODY'
          DR Accesorios RD v2.6 — DR Agenda y comunidad conectada 📅
          
          Actualización preparada a partir de las mejoras desarrolladas el 10 y 11 de octubre de 2026, integrando la ampliación de Social y comunidad con DR Agenda y sus notificaciones.
          
          ### ✈️ Social y comunidad: primeras mejoras de v2.6
          • Telegram se incorpora como cuarta opción del carrusel Social del Inicio.
          • Menú «Social y comunidad» ampliado con accesos a Telegram y Beehiiv para consultar la comunidad y suscribirse a las noticias.
          • Navegación e integración de estos accesos dentro de la experiencia existente, sin eliminar las redes y funciones sociales anteriores.
          
          ### 📅 DR Agenda: eventos y experiencias cercanas
          • Sección DR Agenda en Menú con diseño Material 3, eventos reales, fotografías, fechas y horarios adaptados a República Dominicana.
          • Catálogo de eventos servido desde Firebase Hosting secundario; sin eventos ficticios ni dependencia de Firebase Blaze o Railway para Agenda.
          • Ubicación al abrir Agenda, con opciones de localización precisa, aproximada o manual y cálculo de distancia a eventos.
          • Filtros de cercanía, enlaces de ubicación y navegación hacia Google Maps.
          • Fotografías de eventos a tamaño completo, sin recortes y con visor ampliable y zoom de hasta 5 aumentos.
          • Acceso para agregar eventos a Google Calendar con la información del evento precargada.
          • Actualización de la lista de eventos mediante gesto de deslizar.
          
          ### 🔔 Notificaciones de eventos
          • Notificaciones FCM de DR Agenda integradas en el Centro de Notificaciones, con apertura directa al evento.
          • Recepción de avisos incluso cuando la aplicación está cerrada, conforme a las pruebas del 11 de octubre.
          • Entrega reforzada con prioridad HIGH, WorkManager acelerado, verificación de suscripción y control de duplicados.
          • Margen de hasta 15 minutos para eventos recién finalizados, evitando descartar avisos relevantes antes de tiempo.
          
          ### 🛡️ Continuidad, compatibilidad y distribución
          • Se conservan DR Audio, DR Radar, lector de noticias, comentarios, respuestas, favoritos, lectura offline y servicios Firebase existentes.
          • El bot de Telegram y la web de DR Agenda son servicios complementarios y se actualizan por separado; esta edición incorpora sus accesos e integración Android.
          • Edición GitHub: versionName 2.6 y versionCode 22, con actualizador GitHub/Firebase.
          • Edición Store: versionName 2.6 y versionCode 23, sin actualizador externo, con publicación independiente de este lanzamiento.
          
          **Lanzamiento programado:** 24 de noviembre de 2026, 8:00 p. m. (República Dominicana).
          
          ---
          
          **Archivo:** `dr-accesorios-rd.apk`
          **Estado de validación:** falta compilar, firmar, instalar/probar y adjuntar el APK Release definitivo de GitHub v2.6.
          **SHA-256:** pendiente de fijar tras validar el APK definitivo; el workflow bloquea la publicación hasta entonces.
          BODY

          if [ -z "$RELEASE_ID" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="2.6" \
              -f target_commitish="main" \
              -f name="DR Accesorios RD v2.6 — DR Agenda y comunidad conectada 📅" \
              -F draft=true \
              -F prerelease=false \
              --raw-field body="$(cat /tmp/v26-body.md)"
            echo "Draft 2.6 created."
            exit 0
          fi

          IS_DRAFT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release 2.6 is no longer a draft; metadata sync skipped."
            exit 0
          fi

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field tag_name="2.6" \
            --raw-field name="DR Accesorios RD v2.6 — DR Agenda y comunidad conectada 📅" \
            --raw-field body="$(cat /tmp/v26-body.md)"

          echo "Draft 2.6 metadata synchronized."

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 22,
            "versionName": "2.6",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "✈️ Telegram en carrusel Social y menú de comunidad\n📩 Acceso a Beehiiv desde Social y comunidad\n📅 DR Agenda con eventos reales, fichas y horarios RD\n📍 GPS automático/manual, distancias y Google Maps\n🖼️ Fotografías sin recorte y zoom de hasta 5×\n🗓️ Agregar eventos a Google Calendar\n🔔 Alertas FCM Agenda con apertura directa y mayor fiabilidad\n🔄 Deslizar para actualizar Agenda\n🎧 DR Audio, 📡 DR Radar, noticias y comunidad preservados"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 22 --version-name 2.6 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.6") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 2.6 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          EXPECTED_DIGEST="sha256:PENDING_SIGNED_V26_APK"

          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::v2.6 signed APK SHA-256 has not been pinned. Refusing publication."
            exit 1
          fi

          if [ "$APK_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK digest mismatch."
            echo "Expected: $EXPECTED_DIGEST"
            echo "Found:    $APK_DIGEST"
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 2.6 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 22 --version-name 2.6 --legacy-max-version-code 14

      - name: Legacy 1.6/1.7 delivery reminder
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          echo "::warning::Versions 1.6 and 1.7 are not covered by the Firestore registry. Send the two Firebase Notifications composer campaigns targeted strictly by App version after this release. See docs/legacy-update-delivery.md."
          {
            echo "### Legacy update delivery still required"
            echo ""
            echo "Versions **1.6** and **1.7** must receive separate Firebase Notifications composer campaigns targeted strictly by **App version**."
            echo ""
            echo "Follow `docs/legacy-update-delivery.md`. Do not use a notification payload on the shared `blog_updates` topic."
          } >> "$GITHUB_STEP_SUMMARY"
