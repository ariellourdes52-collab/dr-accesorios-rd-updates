name: Diagnose DR Audio male voice

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-dr-audio-male.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect live DR Audio catalog and male assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          index_url = "https://dr-accesorios-rd.web.app/dr-audio/index.json"
          req = urllib.request.Request(index_url, headers={"User-Agent":"DR-Audio-Diagnostics/1.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          entries = data.get("entries") or []
          latest = entries[:5]
          report = {
              "schemaVersion": data.get("schemaVersion"),
              "generatedAt": data.get("generatedAt"),
              "voices": data.get("voices"),
              "latestCount": data.get("latestCount"),
              "latestMaleReady": data.get("latestMaleReady"),
              "historyCount": data.get("historyCount"),
              "latest": [],
          }

          for e in latest:
              male = (e.get("audioMaleUrl") or "").strip()
              female = (e.get("audioFemaleUrl") or e.get("audioUrl") or "").strip()
              item = {
                  "title": e.get("title"),
                  "url": e.get("url"),
                  "femaleReady": bool(female),
                  "femaleVoice": e.get("femaleVoice") or e.get("voice"),
                  "maleReady": bool(male),
                  "maleVoice": e.get("maleVoice"),
                  "maleContentHash": e.get("maleContentHash"),
                  "maleBytes": e.get("maleBytes"),
                  "maleUrl": male or None,
                  "maleHttpStatus": None,
                  "maleContentLength": None,
                  "maleContentType": None,
                  "maleHttpError": None,
              }
              if male:
                  try:
                      head = urllib.request.Request(male, method="HEAD", headers={"User-Agent":"DR-Audio-Diagnostics/1.0"})
                      with urllib.request.urlopen(head, timeout=30) as hr:
                          item["maleHttpStatus"] = hr.status
                          item["maleContentLength"] = hr.headers.get("Content-Length")
                          item["maleContentType"] = hr.headers.get("Content-Type")
                  except Exception as ex:
                      item["maleHttpError"] = repr(ex)
              report["latest"].append(item)

          report["latestMaleUrlsReadyComputed"] = sum(1 for x in report["latest"] if x["maleReady"])
          Path("diagnostics/dr-audio-male.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Save diagnostic report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/dr-audio-male.json
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged."
            exit 0
          fi
          git commit -m "Save DR Audio male voice diagnostic"
          git push
