name: NodoPin - Railway FCM bridge safety tests
on:
  push:
    branches: [main]
    paths:
      - 'services/dr-radar-webpush/nodopin_fcm_bridge.py'
      - 'services/dr-radar-webpush/app.py'
      - 'tests/test_nodopin_railway_fcm_bridge.py'
      - '.github/workflows/test-nodopin-railway-fcm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install only required test dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyJWT requests cryptography
      - name: Parse actual Railway source and run offline tests
        run: |
          python -m py_compile services/dr-radar-webpush/app.py services/dr-radar-webpush/nodopin_fcm_bridge.py
          python -m unittest discover -s tests -p 'test_nodopin_railway_fcm_bridge.py' -v
