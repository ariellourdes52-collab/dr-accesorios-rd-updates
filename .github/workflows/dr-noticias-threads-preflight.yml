name: DR Noticias Tech - Threads token (solo lectura)
run-name: DR Noticias Tech - Threads identidad de cuenta

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/dr_noticias_threads_preflight.cjs'
      - 'tests/test_dr_noticias_threads_preflight.cjs'
      - '.github/workflows/dr-noticias-threads-preflight.yml'

permissions:
  contents: read

concurrency:
  group: dr-noticias-threads-token-check
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Verificar sintaxis y pruebas sin red
        run: |
          node --check scripts/dr_noticias_threads_preflight.cjs
          node --test tests/test_dr_noticias_threads_preflight.cjs

  threads-token:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Consultar identidad Threads sin publicar
        env:
          DR_NOTICIAS_THREADS_ACCESS_TOKEN: ${{ secrets.DR_NOTICIAS_THREADS_ACCESS_TOKEN }}
        run: node scripts/dr_noticias_threads_preflight.cjs
