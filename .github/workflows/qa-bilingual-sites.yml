name: QA bilingual Web App and Agenda (no deploy)
on:
  push:
    branches: [feature/dr-webapp-agenda-ui-i18n-qa-20261015]
  pull_request:
    paths:
      - 'landing/radar-alertas/index.html'
      - 'landing/radar-alertas/agenda.html'
      - 'agenda_site/agenda/index.html'
      - 'tests/qa_bilingual_sites.cjs'
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify addon-only diff and JavaScript syntax
        run: node tests/qa_bilingual_sites.cjs

  browser-qa:
    name: Offline Chromium and WebKit (no deploy)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.event.pull_request.head.ref == 'feature/dr-webapp-agenda-ui-i18n-qa-20261015'
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test-only Playwright outside repository
        run: |
          mkdir -p "$RUNNER_TEMP/dr-browser-qa"
          npm install --prefix "$RUNNER_TEMP/dr-browser-qa" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/dr-browser-qa/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Exercise isolated HTML and mock events without requests to production
        env:
          NODE_PATH: ${{ runner.temp }}/dr-browser-qa/node_modules
        run: node tests/qa_bilingual_browser.cjs

  preview-hosting-audit:
    name: Validate Hosting identities (GET only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.event.pull_request.head.ref == 'feature/dr-webapp-agenda-ui-i18n-qa-20261015' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only Google auth client
        run: python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.29,<3' 'requests>=2.31,<3'
      - name: Audit both Hosting destinations without mutations
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
          DR_PREVIEW_SITE_MODE: AUDIT_ONLY
        run: python tests/audit_bilingual_preview_hosting.py

  preview-channel-publish:
    name: Preview channels PR41 only - never live
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.event.pull_request.head.ref == 'feature/dr-webapp-agenda-ui-i18n-qa-20261015' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [static-qa, browser-qa, preview-hosting-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    concurrency:
      group: dr-pr41-bilingual-firebase-preview-only
      cancel-in-progress: false
    env:
      DR_PREVIEW_MODE: QA41_PREVIEW_ONLY
      DR_QA_BRANCH: ${{ github.head_ref }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated preview dependencies and syntax gate
        run: |
          python -m py_compile scripts/qa_bilingual_preview_channels.py
          python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.29,<3' 'requests>=2.31,<3'
          mkdir -p "$RUNNER_TEMP/dr-preview-cli"
          npm install --prefix "$RUNNER_TEMP/dr-preview-cli" --no-save --no-package-lock firebase-tools@14.21.0
      - name: Create ONLY non-live expiring preview channels and guarded static bundles
        run: python scripts/qa_bilingual_preview_channels.py prepare
      - name: Publish Agenda ONLY to preview channel
        run: |
          "$RUNNER_TEMP/dr-preview-cli/node_modules/.bin/firebase" hosting:channel:deploy qa-bilingual-pr41 --project dr-accesorios-rd --config "$RUNNER_TEMP/dr-pr41-agenda.firebase.json" --non-interactive --expires 7d
      - name: Publish Web App ONLY to preview channel
        run: |
          "$RUNNER_TEMP/dr-preview-cli/node_modules/.bin/firebase" hosting:channel:deploy qa-bilingual-pr41 --project dr-accesorios-rd --config "$RUNNER_TEMP/dr-pr41-web.firebase.json" --non-interactive --expires 7d
      - name: Verify preview URLs and both unchanged LIVE releases
        run: python scripts/qa_bilingual_preview_channels.py verify

  production-inventory-preflight:
    name: Audit LIVE inventory (read only, never deploy)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/dr-webapp-agenda-ui-i18n-qa-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      DR_PROD_CHECK: READ_ONLY
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only preflight requirements
        run: |
          python -m py_compile tests/preflight_bilingual_production.py
          python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.29,<3' 'requests>=2.31,<3'
      - name: Check exact LIVE inventories, source parity and existing event languages
        run: python tests/preflight_bilingual_production.py

  full-live-overlay-audit:
    name: Audit exact LIVE bytes with overlay (GET only)
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/dr-webapp-agenda-ui-i18n-qa-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      DR_PROD_CANDIDATE: READ_ONLY
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only hosting library
        run: |
          python -m py_compile tests/audit_full_bilingual_candidate.py
          python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.29,<3' 'requests>=2.31,<3'
      - name: Check exact LIVE hashes and unchanged configuration; no writes
        run: python tests/audit_full_bilingual_candidate.py
