name: FCM Update Targeting Preflight

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Target versionCode to analyze'
        required: true
        default: '14'
      versionName:
        description: 'Target versionName to analyze'
        required: true
        default: '2.2'
      legacyMaxVersionCode:
        description: 'Highest legacy versionCode (background fix starts at 14)'
        required: true
        default: '13'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Analyze FCM update targets without sending
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: |
          set -euo pipefail
          python scripts/send_update_notifications.py \
            --version-code "${{ inputs.versionCode }}" \
            --version-name "${{ inputs.versionName }}" \
            --legacy-max-version-code "${{ inputs.legacyMaxVersionCode }}" \
            --preflight
