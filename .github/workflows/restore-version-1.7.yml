name: Restore v1.7 metadata preserving Radar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-version-1.7.yml']
permissions:
  contents: read
concurrency:
  group: dr-accesorios-rd-hosting-repair
  cancel-in-progress: false
jobs:
  restore:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install authentication dependencies
        run: python -m pip install --quiet google-auth requests
      - name: Restore version metadata and preserve all live Hosting files
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import copy, gzip, hashlib, json, os, time
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          
          SITE = "sites/dr-accesorios-rd"
          BASE = "https://firebasehosting.googleapis.com/v1beta1/"
          TARGET = json.loads("{\"versionCode\":8,\"versionName\":\"1.7\",\"forceUpdate\":false,\"downloadUrl\":\"https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk\",\"changelog\":\"🔄 Desliza para actualizar\\n💬 Acceso directo a WhatsApp\\n⚙️ Nuevo panel de información y ajustes\\n🔍 Búsqueda manual de actualizaciones\\n🧹 Gestión y tamaño de caché\\n📴 Aviso automático sin conexión\\n💾 Mejor experiencia con contenido guardado\"}")
          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"]),
              scopes=["https://www.googleapis.com/auth/firebase.hosting"])
          session = AuthorizedSession(credentials)
          
          def api(method, path, **kwargs):
              response = session.request(method, BASE + path, timeout=60, **kwargs)
              response.raise_for_status()
              return response.json()
          
          def active():
              channel = api("GET", SITE + "/channels/live")
              release = channel["release"]
              name = release["version"]["name"]
              return release["name"], SITE + "/versions/" + name.rsplit("/", 1)[1]
          
          def files(version):
              result, token = {}, None
              while True:
                  params = {"pageSize": 1000, "status": "ACTIVE"}
                  if token:
                      params["pageToken"] = token
                  page = api("GET", version + "/files", params=params)
                  for item in page.get("files", []):
                      assert item["path"] not in result, "Duplicate file path"
                      result[item["path"]] = item["hash"]
                  token = page.get("nextPageToken")
                  if not token:
                      return result
          
          def live_json():
              response = requests.get("https://dr-accesorios-rd.web.app/version.json",
                  params={"restore_check": time.time_ns()}, headers={"Cache-Control": "no-cache"}, timeout=30)
              response.raise_for_status()
              return response
          
          github = requests.get(
              "https://api.github.com/repos/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]}, timeout=30)
          github.raise_for_status()
          assert github.json()["tag_name"] == "1.7", "Latest has changed; refusing restoration"
          current = live_json().json()
          assert current["versionCode"] in (7, 8) and current["versionName"] in ("1.6", "1.7"), "Unexpected live version"
          old_release, old_version = active()
          old = api("GET", old_version)
          old_files = files(old_version)
          assert old_files and len(old_files) == int(old["fileCount"]), "Incomplete live inventory"
          assert "/version.json" in old_files, "version.json missing from live inventory"
          config = copy.deepcopy(old.get("config", {}))
          headers = config.setdefault("headers", [])
          headers.append({"glob": "/version.json", "headers": {"Cache-Control": "no-cache, no-store, must-revalidate"}})
          print("Source Hosting version:", old_version, flush=True)
          print("Preserving file paths:", json.dumps(sorted(p for p in old_files if p != "/version.json")), flush=True)
          
          compressed = gzip.compress((json.dumps(TARGET, ensure_ascii=False, indent=2) + "\n").encode(), mtime=0)
          digest = hashlib.sha256(compressed).hexdigest()
          expected = dict(old_files)
          expected["/version.json"] = digest
          created = api("POST", SITE + "/versions", json={"config": config})
          new_version = SITE + "/versions/" + created["name"].rsplit("/", 1)[1]
          items = list(expected.items())
          for offset in range(0, len(items), 1000):
              batch = api("POST", new_version + ":populateFiles", json={"files": dict(items[offset:offset + 1000])})
              required = batch.get("uploadRequiredHashes", [])
              assert set(required) <= {digest}, "An existing Hosting file is unavailable; refusing deployment"
              if digest in required:
                  upload = session.post(batch["uploadUrl"] + "/" + digest, data=compressed,
                      headers={"Content-Type": "application/octet-stream"}, timeout=60)
                  upload.raise_for_status()
          
          assert files(new_version) == expected, "File inventory mismatch before finalization"
          api("PATCH", new_version, params={"updateMask": "status"}, json={"status": "FINALIZED"})
          assert api("GET", new_version).get("config", {}) == config, "Hosting config mismatch"
          assert active() == (old_release, old_version), "Another deployment occurred; refusing to overwrite"
          assert live_json().json() == current, "Live metadata changed during preparation"
          release = api("POST", SITE + "/releases", params={"versionName": new_version},
              json={"message": "Restore v1.7 update metadata; preserve current Radar and all Hosting files"})
          print("Restoration release:", release["name"], flush=True)
          assert active()[1] == new_version
          assert files(new_version) == expected
          for attempt in range(12):
              response = live_json()
              if response.json() == TARGET and "no-store" in response.headers.get("Cache-Control", ""):
                  print("VERIFIED: versionCode=8 versionName=1.7; all other file hashes preserved; no-store active", flush=True)
                  break
              time.sleep(5)
          else:
              raise RuntimeError("Release created but public verification did not complete")
          PY
