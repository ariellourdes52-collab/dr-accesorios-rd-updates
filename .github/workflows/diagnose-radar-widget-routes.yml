name: Diagnose Radar widget public routes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_radar_widget_routes.py'
      - '.github/workflows/diagnose-radar-widget-routes.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/diagnose_radar_widget_routes.py
