name: Release DR Accesorios RD 2.4.1
# Draft-preparation trigger revision: 1

# Automatic publication schedule cancelled on 2026-10-06.
# The existing draft release is intentionally retained as development history.
on:
  push:
    branches:
      - main
    paths:
      - 'release-trigger-v2.4.1.txt'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE-2.4.1 to publish manually'
        required: true
        default: 'NO'

permissions:
  contents: write

concurrency:
  group: dr-accesorios-rd-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Release publication gate
        id: gate
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          proceed=false

          if [ "${{ github.event_name }}" = "push" ]; then
            proceed=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$RELEASE_CONFIRM" = "RELEASE-2.4.1" ]; then
            proceed=true
          fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Workflow self-check
        if: github.event_name == 'push' && steps.gate.outputs.proceed != 'true'
        shell: bash
        run: |
          echo "release-2.4.1.yml parsed correctly."
          echo "Automatic publication is disabled; draft preparation only."

      - name: Prepare or sync v2.4.1 draft
        if: github.event_name == 'push' && steps.gate.outputs.proceed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.4.1") | .id' | head -n 1)"

          cat > /tmp/v241-body.md <<'BODY'
          DR Accesorios RD v2.4.1 — Seguridad App Check reforzada 🛡️

          La versión 2.4.1 es una actualización de mantenimiento y seguridad basada en la v2.4 estable. Corrige la validación de Firebase App Check en la instancia social de comentarios sin alterar la experiencia principal de la aplicación.

          • 🛡️ Firebase App Check reforzado en la instancia social `dr_comments`, validada con Play Integrity para comentarios, respuestas, likes y sincronización social.

          • 🏠 DR Ahora: nueva experiencia central en Home con acceso inmediato a la última noticia, DR Audio, estado de DR Radar y actualización.

          • 🎨 Identidad visual más unificada con Jetpack Compose + Material 3.

          • 🔔 Centro de Notificaciones refinado y mejor integrado con el resto de la aplicación.

          • 🎧 DR Audio más pulido, con mejor continuidad, controles y selector de voz persistente.

          • 📡 DR Radar más integrado dentro de la experiencia diaria de la app.

          • 📴 Mejoras en lectura offline y Continuar leyendo.

          • 📲 Cápsulas sociales para Instagram y TikTok.

          • ⭐ Carrusel de Destacados y navegación del Home refinados.

          • 🔔 Indicador de notificaciones sin leer más claro.

          • ⚙️ Menú y ajustes reorganizados para reducir redundancias.

          • 🚀 Mejoras generales de fluidez, estabilidad y cohesión visual.

          ---

          **Archivo:** `dr-accesorios-rd.apk`

          **SHA-256:** `082d8713991feff4910e3d23fbd4f7a38d4d5cb4e2edfde2dfddde88cd428765`
          BODY

          if [ -z "$RELEASE_ID" ]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="2.4.1" \
              -f target_commitish="main" \
              -f name="DR Accesorios RD v2.4.1 — Seguridad App Check reforzada 🛡️" \
              -F draft=true \
              -F prerelease=false \
              --raw-field body="$(cat /tmp/v241-body.md)"
            echo "Draft 2.4.1 created."
            exit 0
          fi

          IS_DRAFT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')"

          if [ "$IS_DRAFT" != "true" ]; then
            echo "Release 2.4.1 is no longer a draft; metadata sync skipped."
            exit 0
          fi

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --raw-field tag_name="2.4.1" \
            --raw-field name="DR Accesorios RD v2.4.1 — Seguridad App Check reforzada 🛡️" \
            --raw-field body="$(cat /tmp/v241-body.md)"

          echo "Draft 2.4.1 metadata synchronized."

      - name: Checkout repository
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Prepare update metadata and dependencies
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-auth requests
          mkdir -p public
          cat > public/version.json <<'JSON'
          {
            "versionCode": 20,
            "versionName": "2.4.1",
            "forceUpdate": false,
            "downloadUrl": "https://github.com/ariellourdes52-collab/dr-accesorios-rd-updates/releases/latest/download/dr-accesorios-rd.apk",
            "changelog": "🏠 DR Ahora integra Noticias, DR Audio y DR Radar\n🎨 Jetpack Compose + Material 3 más cohesionado\n🔔 Centro de Notificaciones refinado\n🎧 DR Audio más pulido y con voz persistente\n📡 DR Radar mejor integrado\n📴 Lectura offline y Continuar leyendo mejorados\n📲 Instagram y TikTok integrados en Home\n⭐ Destacados y navegación refinados\n⚙️ Menú y ajustes reorganizados\n🚀 Más fluidez, estabilidad y coherencia visual"
          }
          JSON

      - name: Preflight Hosting and prevent version rollback
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json --preflight

      - name: Preflight version-aware FCM targeting
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 20 --version-name 2.4.1 --legacy-max-version-code 14 --preflight

      - name: Verify release and APK (draft or resumed publication)
        if: steps.gate.outputs.proceed == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.4.1") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            echo "Release 2.4.1 was not found."
            exit 1
          fi

          APK_COUNT="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '[.[] | select(.name=="dr-accesorios-rd.apk")] | length')"

          if [ "$APK_COUNT" -ne 1 ]; then
            echo "Expected exactly one dr-accesorios-rd.apk asset; found $APK_COUNT."
            exit 1
          fi

          APK_DIGEST="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .digest')"
          EXPECTED_DIGEST="sha256:082d8713991feff4910e3d23fbd4f7a38d4d5cb4e2edfde2dfddde88cd428765"

          if [[ "$EXPECTED_DIGEST" != sha256:* ]]; then
            echo "Final v2.4.1 APK SHA-256 is locked in release-2.4.1.yml."
            echo "Found uploaded APK digest: $APK_DIGEST"
            exit 1
          fi

          if [ "$APK_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK digest mismatch."
            echo "Expected: $EXPECTED_DIGEST"
            echo "Found:    $APK_DIGEST"
            exit 1
          fi

          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release 2.4.1 as latest
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" -F draft=false -F prerelease=false -f make_latest=true

      - name: Verify Latest identity and permanent APK URL
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ steps.release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dr-accesorios-rd.apk"
          for attempt in {1..18}; do
            LATEST_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.id')"
            if [ "$LATEST_ID" = "$EXPECTED_RELEASE_ID" ] && curl --fail --silent --location --head "$URL" > /dev/null; then
              echo "Expected release is Latest and APK URL is live."
              exit 0
            fi
            sleep 10
          done
          echo "Latest identity or permanent APK URL verification failed."
          exit 1

      - name: Deploy version metadata preserving Radar and all Hosting files
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_version_preserving_hosting.py public/version.json

      - name: Send version-aware FCM update notification
        if: steps.gate.outputs.proceed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}'
        run: python scripts/send_update_notifications.py --version-code 20 --version-name 2.4.1 --legacy-max-version-code 14

      - name: Legacy 1.6/1.7 delivery reminder
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          echo "::warning::Versions 1.6 and 1.7 are not covered by the Firestore registry. Send the two Firebase Notifications composer campaigns targeted strictly by App version after this release. See docs/legacy-update-delivery.md."
          {
            echo "### Legacy update delivery still required"
            echo ""
            echo "Versions **1.6** and **1.7** must receive separate Firebase Notifications composer campaigns targeted strictly by **App version**."
            echo ""
            echo "Follow `docs/legacy-update-delivery.md`. Do not use a notification payload on the shared `blog_updates` topic."
          } >> "$GITHUB_STEP_SUMMARY"
