name: Deploy DR Radar Blogger widget

on:
  push:
    branches:
      - main
    paths:
      - 'landing/radar-widget/**'
      - 'landing/radar-alertas/**'
      - 'scripts/deploy_radar_widget.py'
      - '.github/workflows/deploy-radar-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-blogger-widget-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests pillow

      - name: Choose least-change deployment
        id: deploy_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          scope=broad
          if [[ "$EVENT_NAME" == "push" ]]; then
            scope=skip
            if [[ -n "${BEFORE:-}" ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" HEAD > /tmp/dr-radar-changed-paths.txt
              if grep -q '^landing/radar-widget/index.html
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: |
          if [[ "${{ steps.deploy_scope.outputs.scope }}" == "widget_only" ]]; then
            python scripts/deploy_radar_widget_bilingual_only.py
          else
            python scripts/deploy_radar_widget.py
          fi
 /tmp/dr-radar-changed-paths.txt &&
                 ! grep -Ev '^(landing/radar-widget/index\\.html|scripts/deploy_radar_widget_bilingual_only\\.py|\\.github/workflows/deploy-radar-widget\\.yml)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_radar_widget.py
 /tmp/dr-radar-changed-paths.txt | grep -q '.'; then
                scope=widget_only
              else
                scope=broad
              fi
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Deployment scope: $scope"

      - name: Validate widget-only script
        if: steps.deploy_scope.outputs.scope == 'widget_only'
        run: python -m py_compile scripts/deploy_radar_widget_bilingual_only.py

      - name: Deploy DR Radar Blogger widget preserving Hosting
        if: steps.deploy_scope.outputs.scope != 'skip'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_radar_widget.py
