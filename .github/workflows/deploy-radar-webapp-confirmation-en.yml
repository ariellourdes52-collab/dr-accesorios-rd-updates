name: Translate Radar Web App confirmation only

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_radar_webapp_two_strings_only.py'
      - '.github/workflows/deploy-radar-webapp-confirmation-en.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-webapp-confirmation-only
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hosting API dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Validate Python source
        run: python -m py_compile scripts/deploy_radar_webapp_two_strings_only.py
      - name: Update only active Radar Web App bilingual text
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/deploy_radar_webapp_two_strings_only.py
