name: DR Noticias Tech - Piloto Instagram (vista previa por defecto)
run-name: DR Noticias Tech - Instagram ${{ inputs.mode || 'tests' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: preview
        options:
          - preview
          - publish
        description: Preview no publica; publish exige todas las aprobaciones
      article_url:
        type: string
        required: false
        description: URL exacta de Blogger; obligatoria para publicar
      approved_sha256:
        type: string
        required: false
        description: SHA256 de portada mostrado en vista previa; obligatorio para publicar
      confirm:
        type: string
        required: false
        default: NO
        description: Publicar solo con frase PUBLICAR-UNA-NOTICIA-DRNOTICIASTECH
  pull_request:
    paths:
      - 'scripts/dr_noticias_instagram_pilot.py'
      - 'tests/test_dr_noticias_instagram_pilot.py'
      - '.github/workflows/dr-noticias-instagram-pilot.yml'

permissions:
  contents: read

concurrency:
  group: dr-noticias-instagram-pilot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'
      - name: Validar caption, cuenta y anti-duplicados sin Meta
        run: |
          python -m py_compile scripts/dr_noticias_instagram_pilot.py
          python -m unittest discover -s tests -p 'test_dr_noticias_instagram_pilot.py' -v

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'
      - name: Comprobar cuenta, portada y descripcion SIN PUBLICAR
        env:
          DR_NOTICIAS_IG_ACCESS_TOKEN: ${{ secrets.DR_NOTICIAS_IG_ACCESS_TOKEN }}
          ARTICLE_URL: ${{ inputs.article_url }}
        run: python scripts/dr_noticias_instagram_pilot.py --mode preview --article-url "$ARTICLE_URL"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet --disable-pip-version-check 'Pillow>=11,<13'
      - name: Publicar SOLO una noticia con aprobacion manual y ledger
        env:
          DR_NOTICIAS_IG_ACCESS_TOKEN: ${{ secrets.DR_NOTICIAS_IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTICLE_URL: ${{ inputs.article_url }}
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
          APPROVED_CONFIRM: ${{ inputs.confirm }}
        run: |
          python scripts/dr_noticias_instagram_pilot.py --mode publish --article-url "$ARTICLE_URL" --approved-sha256 "$APPROVED_SHA" --confirm "$APPROVED_CONFIRM"
