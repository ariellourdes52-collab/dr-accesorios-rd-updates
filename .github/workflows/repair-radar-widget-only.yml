name: Repair DR Radar Blogger widget only

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/repair_radar_widget_only.py'
      - '.github/workflows/repair-radar-widget-only.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-radar-widget-only
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Repair only Blogger Radar widget
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/repair_radar_widget_only.py
