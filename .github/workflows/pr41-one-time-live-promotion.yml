name: PR41 approved bilingual release (one time)
on:
  push:
    branches: [feature/dr-webapp-agenda-ui-i18n-qa-20261015]
    paths:
      - '.github/workflows/pr41-one-time-live-promotion.yml'
permissions:
  contents: read
concurrency:
  group: dr-pr41-one-time-live-promotion
  cancel-in-progress: false
jobs:
  approved-release:
    if: github.event.head_commit.message == 'release(pr41): approved one-time bilingual production promotion' && github.ref == 'refs/heads/feature/dr-webapp-agenda-ui-i18n-qa-20261015' && github.repository == 'ariellourdes52-collab/dr-accesorios-rd-updates'
    name: Verify approved candidate then promote Agenda and Web App with rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DR_APPROVAL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static regression and release-script syntax
        run: |
          node tests/qa_bilingual_sites.cjs
          python -m py_compile scripts/pr41_promote_approved_candidate.py
      - name: Install read-only Firebase auth client
        run: python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.29,<3' 'requests>=2.31,<3'
      - name: Final LIVE/preview diff and safety preflight (GET only)
        env:
          DR_PR41_RELEASE_MODE: DRY_RUN
        run: python scripts/pr41_promote_approved_candidate.py
      - name: Approved LIVE promotion - Agenda first, Web App second
        env:
          DR_PR41_RELEASE_MODE: APPROVED_LIVE_PROMOTION
        run: python scripts/pr41_promote_approved_candidate.py
