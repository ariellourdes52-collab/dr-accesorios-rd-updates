name: Expire seismic alert in DR Ahora

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-radar-seismic-home-expire
  cancel-in-progress: true

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Expire seismic alert for DR Ahora only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DR_ACCESORIOS_RD }}
        run: python scripts/expire_seismic_home_alerts.py
