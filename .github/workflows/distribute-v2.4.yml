name: Prepare v2.4.1 on existing pre-release distribution link

on:
  push:
    branches:
      - main
    paths:
      - 'distribution-trigger-v2.4.txt'

permissions:
  contents: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify verified v2.4.1 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="2.4.1" and .draft==true) | .id' | head -n 1)"
          test -n "$RELEASE_ID"
          ASSET_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="dr-accesorios-rd.apk") | .id')"
          test -n "$ASSET_ID"
          mkdir -p /tmp/v241
          gh api -H "Accept: application/octet-stream" "/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /tmp/v241/dr-accesorios-rd-v2.4.apk
          echo "082d8713991feff4910e3d23fbd4f7a38d4d5cb4e2edfde2dfddde88cd428765  /tmp/v241/dr-accesorios-rd-v2.4.apk" | sha256sum -c -

      - name: Publish isolated distribution branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan distribution-v2.4
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p distribution/v2.4
          cp /tmp/v241/dr-accesorios-rd-v2.4.apk distribution/v2.4/dr-accesorios-rd-v2.4.apk
          printf '%s\n'             'DR Accesorios RD v2.4.1 - distribución previa'             'Archivo estable del enlace: dr-accesorios-rd-v2.4.apk (contenido v2.4.1)'             'SHA-256: 082d8713991feff4910e3d23fbd4f7a38d4d5cb4e2edfde2dfddde88cd428765'             'Distribución previa v2.4.1. La ruta se conserva para no romper el enlace vigente.'             > distribution/v2.4/README.txt
          git add distribution/v2.4
          git commit -m "Update isolated distribution link to v2.4.1 APK"
          git push --force origin distribution-v2.4
